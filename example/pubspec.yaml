name: flutter_gsmsip_example
description: "Example app for flutter_gsmsip - GOSTsimbox Gateway"
license: NativeMindNONC
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Library dependencies. flutter_gsm is used directly (not just
  # transitively via flutter_gsmsip) for the Dashboard's modem-listing
  # card — see flows/flutter_gsmsip/sdd-flutter_gsmsip-example/
  # 02-specifications.md.
  flutter_gsmsip:
    path: ../
  flutter_gsm:
    path: ../../flutter_gsm

  shared_preferences: ^2.2.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# See ../pubspec.yaml for why these overrides exist.
dependency_overrides:
  plugin_platform_interface: ^2.1.8
  flutter_dialer:
    path: ../../flutter_dialer

flutter:
  uses-material-design: true
  generate: true
