name: flutter_gsmsip
description: "Pure-Dart SIP<->GSM voice-gateway/SMPP orchestrator, built on flutter_gsm (GSM leg) and flutter_nmsip (SIP leg)."
version: 0.1.0
homepage: "https://github.com/telon/flutter_gsmsip"

# Ignore false secrets in legacy folder
false_secrets:
  - /legacy/**

environment:
  sdk: ^3.10.8
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

  # GSM leg (modem discovery, calls, SMS) — flows/sdd-flutter_gsm
  flutter_gsm:
    path: ../flutter_gsm
  # SIP leg (PJSIP-based) — see 02-specifications.md §3.1's capability-gap
  # check against this package's real API
  flutter_nmsip:
    path: ../flutter_nmsip

  # Functional
  dartz: ^0.10.1  # Either type for functional error handling
  equatable: ^2.0.5  # Value equality for entities
  
  # Logging
  logger: ^2.0.1
  
  # Storage
  shared_preferences: ^2.2.2
  
  # HTTP
  http: ^1.2.1
  
  # Permissions
  permission_handler: ^11.3.1
  
  # Utilities
  intl: ^0.20.2
  get_it: ^7.6.0
  async: ^2.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# See flutter_gsm/pubspec.yaml for why: flutter_dialer/flutter_tele/
# flutter_smsussd (transitive, via flutter_gsm) declare
# `plugin_platform_interface: ^3.0.0` (never published) and flutter_tele
# depends on flutter_dialer from pub.dev (not published, local-only).
dependency_overrides:
  plugin_platform_interface: ^2.1.8
  flutter_dialer:
    path: ../flutter_dialer

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # Pure Dart — no native platform registration of its own. The GSM leg
  # comes from flutter_gsm's platform implementations, the SIP leg from
  # flutter_nmsip's; this package only orchestrates them. Previously
  # declared android/linux plugin platforms (FlutterGsmsipPlugin,
  # LinuxFlutterGsmsip) were leftover native code from before the
  # flutter_gsm split — removed, see
  # flows/sdd-flutter_gsm/04-implementation-log.md.

  # To add assets to your plugin package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your plugin package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
